<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auction details | Bidly</title>
    <link rel="stylesheet" href="./css/style.css">
  </head>
  <body>
    <header id="site-header"></header>

    <main class="container py-4">
      <a href="./index.html" class="btn btn-primary btn-sm mb-4">
        &larr; Back home
      </a>

      <p id="listing-status" role="status">Loading auction…</p>

      <article id="listing-details" aria-labelledby="listing-title" hidden>
        <div class="row g-4">
          <div class="col-md-6">
            <div class="ratio ratio-1x1 rounded overflow-hidden bg-body-secondary">
              <div id="listing-image-placeholder">
                <div class="d-grid h-100 place-items-center align-items-center text-center">
                  No image available
                </div>
              </div>
              <img id="listing-image" class="object-fit-cover" alt="" hidden>
            </div>
          </div>

          <div class="col-md-6">
            <div class="card h-100">
              <div class="card-body d-flex flex-column justify-content-between gap-3">
                <div>
                  <h1 id="listing-title" class="h2 mb-2"></h1>
                  <p id="listing-seller" class="text-body-secondary mb-0"></p>
                </div>

                <dl class="d-flex text-center border rounded overflow-hidden mb-0">
                  <div class="w-50 bg-primary-subtle p-3 border-end">
                    <dt class="small text-body-secondary">Time remaining</dt>
                    <dd id="listing-time" class="fw-bold mb-0"></dd>
                  </div>
                  <div class="w-50 bg-primary-subtle p-3">
                    <dt class="small text-body-secondary">Current bid</dt>
                    <dd id="listing-bid" class="fw-bold mb-0"></dd>
                  </div>
                </dl>
              </div>
            </div>
          </div>

          <section class="col-md-6" aria-labelledby="description-heading">
            <div class="card card-body">
              <h2 id="description-heading" class="h5">Description</h2>
              <p id="listing-description" class="mb-0"></p>
            </div>
          </section>

          <section class="col-md-6" aria-labelledby="bid-history-heading">
            <div class="card card-body">
              <div class="d-flex justify-content-between gap-2">
                <h2 id="bid-history-heading" class="h5">Bid history</h2>
                <span id="bid-count" class="text-body-secondary small"></span>
              </div>
              <p id="no-bids" class="mb-0" hidden>No bids yet.</p>
              <ul id="bid-history" class="list-group list-group-flush"></ul>
            </div>
          </section>
        </div>
      </article>
    </main>

    <script type="module" src="./js/listing.js"></script>
  </body>
</html>
